<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>오픽 72 만능패턴 듀얼 보이스 트레이너</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #1e293b;
      --primary: #38bdf8;
      --accent: #22c55e;
      --danger: #ef4444;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 650px;
      border-radius: 1.25rem;
      padding: 1.5rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }
    /* 모드 전환 탭 */
    .tab-group {
      display: flex;
      background: #0f172a;
      border-radius: 0.75rem;
      padding: 0.3rem;
      gap: 0.3rem;
    }
    .tab-btn {
      flex: 1;
      padding: 0.75rem 0.5rem;
      border: none;
      border-radius: 0.5rem;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      color: var(--text-sub);
      background: transparent;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: #2563eb;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(37,99,235,0.4);
    }
    /* 배지 및 카테고리 */
    .header-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .badge {
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--primary);
    }
    .progress-count {
      font-size: 0.85rem;
      color: var(--text-sub);
    }
    /* 문장 디스플레이 영역 */
    .display-box {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 0.75rem;
      padding: 1.5rem 1.2rem;
      text-align: center;
      min-height: 160px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.75rem;
    }
    .main-text {
      font-size: clamp(1.25rem, 4.5vw, 1.6rem);
      font-weight: 700;
      line-height: 1.4;
      word-break: keep-all;
    }
    .sub-text {
      font-size: clamp(0.95rem, 3.5vw, 1.1rem);
      color: var(--text-sub);
      line-height: 1.4;
      word-break: keep-all;
    }
    /* 음성 인식 결과 박스 */
    .voice-status {
      border: 1px dashed #475569;
      border-radius: 0.6rem;
      padding: 0.85rem;
      text-align: center;
      min-height: 54px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.3rem;
    }
    .recognized-text {
      font-size: 0.95rem;
      color: #e2e8f0;
      font-style: italic;
    }
    .feedback {
      font-size: 0.85rem;
      font-weight: 700;
    }
    .feedback.success { color: var(--accent); }
    .feedback.fail { color: var(--danger); }
    /* 컨트롤 버튼 */
    .btn-grid {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 0.6rem;
    }
    button.action-btn {
      padding: 0.9rem;
      border: none;
      border-radius: 0.6rem;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s;
    }
    button.action-btn:active { opacity: 0.8; }
    .btn-mic { background: var(--accent); color: #0b0f19; }
    .btn-mic.listening { background: var(--danger); color: #ffffff; }
    .btn-next { background: #475569; color: #ffffff; }
    .btn-hint-toggle {
      background: #0284c7;
      color: #ffffff;
      padding: 0.6rem;
      border-radius: 0.5rem;
      font-size: 0.85rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      display: none;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- 모드 선택 탭 -->
  <div class="tab-group">
    <button class="tab-btn active" id="tabPractice" onclick="switchMode('practice')">무한 연습 모드 (영·한)</button>
    <button class="tab-btn" id="tabTest" onclick="switchMode('test')">실전 테스트 모드 (한글만)</button>
  </div>

  <!-- 상단 정보 -->
  <div class="header-info">
    <span class="badge" id="categoryBadge">카테고리 로딩 중</span>
    <span class="progress-count" id="progressText">1 / 24</span>
  </div>

  <!-- 메인 프롬프트 디스플레이 -->
  <div class="display-box">
    <div class="main-text" id="primaryPrompt">영어/한글 준비 중...</div>
    <div class="sub-text" id="secondaryPrompt">설명 준비 중...</div>
    <button class="btn-hint-toggle" id="hintToggleBtn" onclick="toggleTestHint()">정답 힌트 열기</button>
  </div>

  <!-- 음성 인식 모니터링 영역 -->
  <div class="voice-status">
    <div class="recognized-text" id="recognizedOutput">마이크를 켜고 편하게 말씀하세요.</div>
    <div class="feedback" id="evalFeedback"></div>
  </div>

  <!-- 하단 컨트롤 버튼 -->
  <div class="btn-grid">
    <button class="action-btn btn-mic" id="micBtn" onclick="toggleMic()">🎙️ 마이크 시작</button>
    <button class="action-btn btn-next" onclick="moveNext()">건너뛰기 ⏩</button>
  </div>
</div>

<script>
// 유튜브 핵심 72 패턴 기반 압축 데이터셋
const patternData = [
  { cat: "Pattern 1 (여가활동)", en: "I really enjoy listening to music in my free time", ko: "자유시간에 음악 듣는 것을 정말 즐겨요.", tip: "동명사(~ing)를 목적어로 써서 취미를 말할 때 활용" },
  { cat: "Pattern 2 (최애활동)", en: "One of my favorite activities is watching movies", ko: "제가 가장 좋아하는 활동 중 하나는 영화 감상입니다.", tip: "One of my favorite activities is ~ing 구조" },
  { cat: "Pattern 3 (일상루틴)", en: "I usually stay home and relax when I have free time", ko: "시간 날 때 보통 집에서 편히 쉬어요.", tip: "usually + 현재동사로 평소 루틴 묘사" },
  { cat: "Pattern 4 (주말활동)", en: "I often travel domestically on weekends", ko: "주말에는 종종 국내 여행을 가요.", tip: "domestically(국내로) 부사 활용" },
  { cat: "Pattern 7 (이유제시)", en: "I especially like going to cafes because it helps me relax", ko: "카페 가는 것을 특히 좋아하는데, 휴식에 도움이 되기 때문입니다.", tip: "because it helps me relax는 모든 여가에 적용 가능한 만능 이유" },
  { cat: "Pattern 8 (효과/장점)", en: "It's a great way to relieve stress", ko: "스트레스를 풀기에 정말 좋은 방법입니다.", tip: "relieve stress / stay healthy 등으로 확장" },
  { cat: "Pattern 9 (기분상태)", en: "It makes me feel refreshed", ko: "그것은 제 기분을 상쾌하게 만들어 줍니다.", tip: "make + me + feel + 형용사 구조" },
  { cat: "Pattern 10 (장소묘사)", en: "There is a great place near my house where I walk in the park", ko: "집 근처에 산책하기 좋은 멋진 공원이 하나 있어요.", tip: "관계부사 where로 장소의 특징 설명" },
  { cat: "Pattern 12 (과거경험)", en: "I remember one memorable experience when I traveled to Busan", ko: "부산으로 여행 갔을 때 기억에 남는 경험이 하나 있어요.", tip: "과거 경험 시작 시 완벽한 오프닝 문장" },
  { cat: "Pattern 15 (돌발/문제)", en: "However I once had a problem when I traveled abroad", ko: "하지만 해외여행 중 한 번 문제가 생긴 적이 있습니다.", tip: "과거 사건/계기 전환용 템플릿" },
  { cat: "Pattern 17 (과거 vs 현재)", en: "Compared to the past people go to cafes much more these days", ko: "과거에 비해 요즘 사람들은 카페에 훨씬 더 많이 갑니다.", tip: "14~15번 비교 문제 오프닝 필수 패턴" },
  { cat: "Pattern 20 (일상의 일부)", en: "That's why working out has become an important part of my life", ko: "그래서 운동은 제 일상에서 중요한 부분이 되었습니다.", tip: "has become an important part of my life (현재완료)" },
  { cat: "Pattern 25 (사회적 이슈)", en: "These days people talk a lot about technology", ko: "요즘 사람들은 기술에 대해 이야기를 많이 합니다.", tip: "산업/기술/재활용 등 시사 돌발 토픽" },
  { cat: "Pattern 28 (장단점)", en: "One advantage of smartphones is convenience", ko: "스마트폰의 한 가지 장점은 편리함입니다.", tip: "One advantage of 명사 is 명사 구조" },
  { cat: "Pattern 37 (문제해결 시작)", en: "At first I didn't know how to handle the problem at work", ko: "처음에는 직장에서 그 문제를 어떻게 처리해야 할지 몰랐어요.", tip: "handle the problem: 문제 대처" },
  { cat: "Pattern 38 (해결과정)", en: "But eventually I found a solution for the reservation issue", ko: "하지만 결국 예약 문제에 대한 해결책을 찾았습니다.", tip: "eventually + found a solution: 마무리 국면" },
  { cat: "Pattern 49 (롤플레이-변경)", en: "I'd like to change my reservation for the hotel", ko: "호텔 예약을 변경하고 싶습니다.", tip: "11번 문의 및 예약 변경 시 기본 문장" },
  { cat: "Pattern 50 (롤플레이-취소)", en: "I need to cancel my reservation for the tour", ko: "투어 예약을 취소해야 합니다.", tip: "I need to cancel ~ 구조" },
  { cat: "Pattern 52 (롤플레이-문의)", en: "I was wondering if tickets are available", ko: "티켓을 구할 수 있는지 알고 싶습니다.", tip: "공손하게 질문할 때 완벽한 패턴" },
  { cat: "Pattern 55 (롤플레이-시간)", en: "What time does the concert start", ko: "콘서트가 몇 시에 시작하나요?", tip: "가장 기본적인 롤플레이 세부 질문" },
  { cat: "Pattern 57 (롤플레이-추천)", en: "Do you have any recommendations for travel destinations", ko: "여행지에 대해 추천해 주실 만한 곳이 있나요?", tip: "추천 요청 질문" },
  { cat: "Pattern 60 (롤플레이-문제제기)", en: "I have a problem with my booking", ko: "제 예약에 문제가 좀 생겼습니다.", tip: "12번 상황극 문제 제기 오프닝" },
  { cat: "Pattern 67 (롤플레이-감사)", en: "I really appreciate your help with my reservation", ko: "예약을 도와주셔서 정말 감사드립니다.", tip: "롤플레이 11~13번 마무리 감사 표현" },
  { cat: "Pattern 70 (롤플레이-마무리)", en: "I'm glad we solved the ticket issue", ko: "티켓 문제가 해결되어 기쁩니다.", tip: "해결 후 안도감 표현" }
];

let currentMode = 'practice'; // 'practice' 또는 'test'
let currentIndex = 0;
let isListening = false;
let recognition = null;
let isHintVisible = false;

// 문자열 정규화
function cleanText(str) {
  return str.toLowerCase().replace(/[^a-z0-9\s]/g, '').trim();
}

// 음성 유사도 판별 (Levenshtein Distance)
function getSimilarity(s1, s2) {
  const a = cleanText(s1);
  const b = cleanText(s2);
  if (a === b) return 1.0;
  if (!a || !b) return 0.0;

  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = 0; i <= a.length; i++) dp[i][0] = i;
  for (let j = 0; j <= b.length; j++) dp[0][j] = j;

  for (let i = 1; i <= a.length; i++) {
    for (let j = 1; j <= b.length; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + cost);
    }
  }
  return 1 - (dp[a.length][b.length] / Math.max(a.length, b.length));
}

// Web Speech API 초기화 (모바일 크롬/사파리 완벽 대응)
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRec) {
  recognition = new SpeechRec();
  recognition.lang = 'en-US';
  recognition.continuous = true;
  recognition.interimResults = false;

  recognition.onresult = (event) => {
    const transcript = event.results[event.results.length - 1][0].transcript;
    document.getElementById('recognizedOutput').textContent = `들린 음성: "${transcript}"`;
    evaluateSpeech(transcript);
  };

  recognition.onerror = (e) => {
    console.warn("STT 이벤트 알림:", e.error);
    if (e.error === 'not-allowed') {
      alert("마이크 권한이 차단되어 있습니다. 브라우저 설정에서 마이크를 허용해 주세요.");
      stopMic();
    }
  };

  recognition.onend = () => {
    if (isListening) {
      try { recognition.start(); } catch(e) {}
    }
  };
}

function updateCard() {
  const cur = patternData[currentIndex];
  document.getElementById('categoryBadge').textContent = cur.cat;
  document.getElementById('progressText').textContent = `${currentIndex + 1} / ${patternData.length}`;
  document.getElementById('recognizedOutput').textContent = "발화를 듣고 있습니다...";
  document.getElementById('evalFeedback').textContent = "";

  const primary = document.getElementById('primaryPrompt');
  const secondary = document.getElementById('secondaryPrompt');
  const hintBtn = document.getElementById('hintToggleBtn');

  if (currentMode === 'practice') {
    // 무한 연습 모드: 영어가 상단에 크게 보이고, 한글 뜻과 팁이 아래에 표시
    hintBtn.style.display = 'none';
    primary.style.color = '#38bdf8';
    primary.textContent = cur.en;
    secondary.innerHTML = `<strong>${cur.ko}</strong><br><span style="font-size:0.85em; color:#64748b;">Tip: ${cur.tip}</span>`;
  } else {
    // 실전 테스트 모드: 한글 뜻만 보이고 영어는 감춤 (힌트 버튼 활성화)
    isHintVisible = false;
    hintBtn.style.display = 'inline-block';
    hintBtn.textContent = '정답 힌트 열기';
    primary.style.color = '#f8fafc';
    primary.textContent = cur.ko;
    secondary.innerHTML = `<span style="color:#64748b;">Tip: ${cur.tip}</span>`;
  }
}

function evaluateSpeech(spoken) {
  const target = patternData[currentIndex].en;
  const sim = getSimilarity(spoken, target);
  const feedback = document.getElementById('evalFeedback');

  // 유사도 70% 이상이거나 핵심 구문이 매칭되면 통과
  if (sim >= 0.70 || cleanText(spoken).includes(cleanText(target))) {
    feedback.className = "feedback success";
    feedback.textContent = `통과! (${Math.round(sim * 100)}%) 다음 문장으로 자동 이동합니다.`;
    setTimeout(() => {
      moveNext();
    }, 900);
  } else {
    feedback.className = "feedback fail";
    feedback.textContent = `다시 시도해 보세요 (인식 일치율: ${Math.round(sim * 100)}%)`;
  }
}

function moveNext() {
  currentIndex = (currentIndex + 1) % patternData.length;
  updateCard();
}

function switchMode(mode) {
  currentMode = mode;
  document.getElementById('tabPractice').classList.toggle('active', mode === 'practice');
  document.getElementById('tabTest').classList.toggle('active', mode === 'test');
  updateCard();
}

function toggleTestHint() {
  const secondary = document.getElementById('secondaryPrompt');
  const hintBtn = document.getElementById('hintToggleBtn');
  const cur = patternData[currentIndex];

  isHintVisible = !isHintVisible;
  if (isHintVisible) {
    secondary.innerHTML = `<strong style="color:#38bdf8;">${cur.en}</strong><br><span style="font-size:0.85em; color:#64748b;">Tip: ${cur.tip}</span>`;
    hintBtn.textContent = '힌트 숨기기';
  } else {
    secondary.innerHTML = `<span style="color:#64748b;">Tip: ${cur.tip}</span>`;
    hintBtn.textContent = '정답 힌트 열기';
  }
}

function toggleMic() {
  if (!recognition) {
    alert("이 브라우저는 음성인식을 지원하지 않습니다. Chrome 또는 Safari(iOS) 최신 버전을 사용해 주세요.");
    return;
  }
  if (!isListening) {
    try {
      recognition.start();
      isListening = true;
      const btn = document.getElementById('micBtn');
      btn.textContent = "🛑 마이크 중지";
      btn.className = "action-btn btn-mic listening";
    } catch(e) {
      console.error(e);
    }
  } else {
    stopMic();
  }
}

function stopMic() {
  isListening = false;
  try { recognition.stop(); } catch(e) {}
  const btn = document.getElementById('micBtn');
  btn.textContent = "🎙️ 마이크 시작";
  btn.className = "action-btn btn-mic";
  document.getElementById('recognizedOutput').textContent = "마이크 일시정지 상태";
}

// 앱 실행 초기화
updateCard();
</script>
</body>
</html>
