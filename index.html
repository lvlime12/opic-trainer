<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>오픽 72 만능패턴 완벽 마스터 트레이너</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #1e293b;
      --primary: #38bdf8;
      --accent: #22c55e;
      --danger: #ef4444;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 680px;
      border-radius: 1.25rem;
      padding: 1.5rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }
    /* 모드 전환 탭 */
    .tab-group {
      display: flex;
      background: #0f172a;
      border-radius: 0.75rem;
      padding: 0.3rem;
      gap: 0.3rem;
    }
    .tab-btn {
      flex: 1;
      padding: 0.75rem 0.5rem;
      border: none;
      border-radius: 0.5rem;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      color: var(--text-sub);
      background: transparent;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: #2563eb;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(37,99,235,0.4);
    }
    /* 헤더 정보 */
    .header-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .badge {
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.3rem 0.7rem;
      border-radius: 9999px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--primary);
    }
    .controls-mini {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .progress-count {
      font-size: 0.85rem;
      color: var(--text-sub);
      font-weight: 600;
    }
    .btn-shuffle {
      background: #334155;
      color: #e2e8f0;
      border: none;
      padding: 0.25rem 0.6rem;
      border-radius: 0.4rem;
      font-size: 0.75rem;
      cursor: pointer;
    }
    /* 문장 디스플레이 영역 */
    .display-box {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 0.75rem;
      padding: 1.8rem 1.2rem;
      text-align: center;
      min-height: 190px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 1rem;
    }
    .main-text {
      font-size: clamp(1.2rem, 4.5vw, 1.55rem);
      font-weight: 700;
      line-height: 1.45;
      word-break: keep-all;
    }
    .sub-box {
      width: 100%;
      font-size: clamp(0.95rem, 3.5vw, 1.1rem);
      line-height: 1.4;
      word-break: keep-all;
      transition: opacity 0.3s ease;
    }
    .btn-hint-toggle {
      background: #0369a1;
      color: #ffffff;
      padding: 0.55rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.85rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      display: none;
      transition: background 0.2s;
    }
    .btn-hint-toggle:hover {
      background: #0284c7;
    }
    /* 음성 인식 모니터링 */
    .voice-status {
      border: 1px dashed #475569;
      border-radius: 0.6rem;
      padding: 0.85rem;
      text-align: center;
      min-height: 58px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.3rem;
    }
    .recognized-text {
      font-size: 0.95rem;
      color: #e2e8f0;
      font-style: italic;
    }
    .feedback {
      font-size: 0.85rem;
      font-weight: 700;
    }
    .feedback.success { color: var(--accent); }
    .feedback.fail { color: var(--danger); }
    /* 컨트롤 버튼 */
    .btn-grid {
      display: grid;
      grid-template-columns: 80px 1.5fr 80px;
      gap: 0.6rem;
    }
    button.action-btn {
      padding: 0.85rem 0.5rem;
      border: none;
      border-radius: 0.6rem;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s;
    }
    button.action-btn:active { opacity: 0.8; }
    .btn-mic { background: var(--accent); color: #0b0f19; }
    .btn-mic.listening { background: var(--danger); color: #ffffff; }
    .btn-nav { background: #475569; color: #ffffff; }
  </style>
</head>
<body>

<div class="container">
  <!-- 모드 선택 탭 -->
  <div class="tab-group">
    <button class="tab-btn active" id="tabPractice" onclick="switchMode('practice')">무한 연습 모드 (영·한)</button>
    <button class="tab-btn" id="tabTest" onclick="switchMode('test')">실전 테스트 모드 (한글만)</button>
  </div>

  <!-- 상단 정보 -->
  <div class="header-info">
    <span class="badge" id="categoryBadge">카테고리 로딩 중</span>
    <div class="controls-mini">
      <button class="btn-shuffle" onclick="shufflePatterns()" title="무작위 순서로 섞기">🔀 셔플</button>
      <span class="progress-count" id="progressText">1 / 72</span>
    </div>
  </div>

  <!-- 메인 프롬프트 영역 -->
  <div class="display-box">
    <div class="main-text" id="primaryPrompt">데이터 준비 중...</div>
    <div class="sub-box" id="secondaryPrompt">설명 준비 중...</div>
    <button class="btn-hint-toggle" id="hintToggleBtn" onclick="toggleTestHint()">💡 정답 및 팁 힌트 열기</button>
  </div>

  <!-- 음성 인식 모니터링 영역 -->
  <div class="voice-status">
    <div class="recognized-text" id="recognizedOutput">마이크를 켜고 편하게 말씀하세요.</div>
    <div class="feedback" id="evalFeedback"></div>
  </div>

  <!-- 컨트롤 버튼 -->
  <div class="btn-grid">
    <button class="action-btn btn-nav" onclick="movePrev()">◀ 이전</button>
    <button class="action-btn btn-mic" id="micBtn" onclick="toggleMic()">🎙️ 마이크 시작</button>
    <button class="action-btn btn-nav" onclick="moveNext()">다음 ▶</button>
  </div>
</div>

];

let currentMode = 'practice'; // 'practice' 또는 'test'
let currentIndex = 0;
let isListening = false;
let recognition = null;
let isHintVisible = false;

// 문자열 정규화 (특수문자 제거 및 소문자화)
function cleanText(str) {
  return str.toLowerCase().replace(/[^a-z0-9\s]/g, '').trim();
}

// 레벤슈타인 거리 기반 유사도 계산
function getSimilarity(s1, s2) {
  const a = cleanText(s1);
  const b = cleanText(s2);
  if (a === b) return 1.0;
  if (!a || !b) return 0.0;

  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = 0; i <= a.length; i++) dp[i][0] = i;
  for (let j = 0; j <= b.length; j++) dp[0][j] = j;

  for (let i = 1; i <= a.length; i++) {
    for (let j = 1; j <= b.length; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + cost);
    }
  }
  return 1 - (dp[a.length][b.length] / Math.max(a.length, b.length));
}

// Web Speech API 초기화
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRec) {
  recognition = new SpeechRec();
  recognition.lang = 'en-US';
  recognition.continuous = true;
  recognition.interimResults = false;

  recognition.onresult = (event) => {
    const transcript = event.results[event.results.length - 1][0].transcript;
    document.getElementById('recognizedOutput').textContent = `들린 음성: "${transcript}"`;
    evaluateSpeech(transcript);
  };

  recognition.onerror = (e) => {
    console.warn("STT 알림:", e.error);
    if (e.error === 'not-allowed') {
      alert("마이크 사용 권한이 필요합니다. 브라우저 설정에서 마이크를 허용해 주세요.");
      stopMic();
    }
  };

  recognition.onend = () => {
    if (isListening) {
      try { recognition.start(); } catch(e) {}
    }
  };
}

function updateCard() {
  const cur = patternData[currentIndex];
  document.getElementById('categoryBadge').textContent = cur.cat;
  document.getElementById('progressText').textContent = `${currentIndex + 1} / ${patternData.length}`;
  document.getElementById('recognizedOutput').textContent = isListening ? "발화를 듣고 있습니다..." : "마이크 버튼을 누르고 말씀하세요.";
  document.getElementById('evalFeedback').textContent = "";

  const primary = document.getElementById('primaryPrompt');
  const secondary = document.getElementById('secondaryPrompt');
  const hintBtn = document.getElementById('hintToggleBtn');

  if (currentMode === 'practice') {
    // 무한 연습 모드: 영어가 메인, 한글 뜻과 팁 상시 노출
    hintBtn.style.display = 'none';
    primary.style.color = '#38bdf8';
    primary.textContent = cur.en;
    secondary.innerHTML = `<strong style="color: #f8fafc; font-size: 1.1em;">${cur.ko}</strong><br><span style="font-size:0.85em; color:#94a3b8; margin-top: 4px; display: inline-block;">💡 Tip: ${cur.tip}</span>`;
  } else {
    // 실전 테스트 모드: 오직 한글 뜻만 단독 표시 (힌트 버튼으로만 정답/팁 열람 가능)
    isHintVisible = false;
    hintBtn.style.display = 'inline-block';
    hintBtn.textContent = '💡 정답 및 팁 힌트 열기';
    primary.style.color = '#f8fafc';
    primary.textContent = cur.ko;
    secondary.innerHTML = ''; // 팁과 영어를 모두 숨김
  }
}

function evaluateSpeech(spoken) {
  const target = patternData[currentIndex].en;
  const sim = getSimilarity(spoken, target);
  const feedback = document.getElementById('evalFeedback');

  // 유사도 70% 이상이거나 핵심 구문이 포함되면 성공
  if (sim >= 0.70 || cleanText(spoken).includes(cleanText(target))) {
    feedback.className = "feedback success";
    feedback.textContent = `🎯 정답 통과! (일치율: ${Math.round(sim * 100)}%) 다음 문장으로 이동합니다.`;
    setTimeout(() => {
      moveNext();
    }, 900);
  } else {
    feedback.className = "feedback fail";
    feedback.textContent = `⚠️ 다시 시도해 보세요 (인식 일치율: ${Math.round(sim * 100)}%)`;
  }
}

// 무한 순환 이동 (다음)
function moveNext() {
  currentIndex = (currentIndex + 1) % patternData.length;
  updateCard();
}

// 무한 순환 이동 (이전)
function movePrev() {
  currentIndex = (currentIndex - 1 + patternData.length) % patternData.length;
  updateCard();
}

// 모드 전환
function switchMode(mode) {
  currentMode = mode;
  document.getElementById('tabPractice').classList.toggle('active', mode === 'practice');
  document.getElementById('tabTest').classList.toggle('active', mode === 'test');
  updateCard();
}

// 실전 테스트 모드 전용 힌트 토글 (버튼을 눌러야만 열림)
function toggleTestHint() {
  const secondary = document.getElementById('secondaryPrompt');
  const hintBtn = document.getElementById('hintToggleBtn');
  const cur = patternData[currentIndex];

  isHintVisible = !isHintVisible;
  if (isHintVisible) {
    secondary.innerHTML = `<strong style="color:#38bdf8; font-size:1.15em;">${cur.en}</strong><br><span style="font-size:0.85em; color:#94a3b8; margin-top:4px; display:inline-block;">💡 Tip: ${cur.tip}</span>`;
    hintBtn.textContent = '🔒 힌트 닫기';
  } else {
    secondary.innerHTML = '';
    hintBtn.textContent = '💡 정답 및 팁 힌트 열기';
  }
}

// 72개 패턴 무작위 셔플 (랜덤 무한 연습)
function shufflePatterns() {
  for (let i = patternData.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [patternData[i], patternData[j]] = [patternData[j], patternData[i]];
  }
  currentIndex = 0;
  updateCard();
  alert("72개 패턴 순서가 무작위로 섞였습니다. 실전 감각을 시험해 보세요!");
}

// 마이크 제어
function toggleMic() {
  if (!recognition) {
    alert("이 브라우저는 음성인식을 지원하지 않습니다. Chrome 또는 Safari 최신 버전을 권장합니다.");
    return;
  }
  if (!isListening) {
    try {
      recognition.start();
      isListening = true;
      const btn = document.getElementById('micBtn');
      btn.textContent = "🛑 마이크 중지";
      btn.className = "action-btn btn-mic listening";
      document.getElementById('recognizedOutput').textContent = "목소리를 듣고 있습니다...";
    } catch(e) {
      console.error(e);
    }
  } else {
    stopMic();
  }
}

function stopMic() {
  isListening = false;
  try { recognition.stop(); } catch(e) {}
  const btn = document.getElementById('micBtn');
  btn.textContent = "🎙️ 마이크 시작";
  btn.className = "action-btn btn-mic";
  document.getElementById('recognizedOutput').textContent = "마이크 일시정지 상태";
}

// 초기 로딩
updateCard();
</script>
